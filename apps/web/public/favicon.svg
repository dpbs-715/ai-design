<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  role="img"
  aria-label="视界工场"
>
  <defs>
    <filter id="mark-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      .sheet-back {
        fill: #f1f2f4;
        stroke: #7a7f88;
      }

      .sheet-middle {
        fill: #e2e4e8;
        stroke: #555a63;
      }

      .sheet-glow {
        stroke: #111317;
      }

      .sheet-main {
        fill: #fff;
        stroke: #111317;
      }

      @media (prefers-color-scheme: dark) {
        .sheet-back {
          fill: #151619;
          stroke: #6b6f78;
        }

        .sheet-middle {
          fill: #1c1e23;
          stroke: #969ca7;
        }

        .sheet-glow,
        .sheet-main {
          stroke: #f7f8fa;
        }

        .sheet-main {
          fill: #101114;
        }
      }
    </style>
  </defs>

  <g transform="rotate(-7 32 32)">
    <g transform="translate(-5.5 2.5) rotate(-7 32 32)">
      <rect class="sheet-back" x="12" y="12" width="40" height="40" rx="11" stroke-width="1.5"/>
    </g>
    <g transform="translate(5.5 2.5) rotate(8 32 32)">
      <rect class="sheet-middle" x="12" y="12" width="40" height="40" rx="11" stroke-width="1.5"/>
    </g>
    <g transform="translate(0 -3)">
      <rect class="sheet-glow" x="12" y="12" width="40" height="40" rx="11" fill="none" stroke-width="4" opacity=".42" filter="url(#mark-glow)"/>
      <rect class="sheet-main" x="12" y="12" width="40" height="40" rx="11" stroke-width="2"/>
    </g>
  </g>
</svg>
